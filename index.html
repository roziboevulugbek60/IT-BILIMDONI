
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Bilimdoni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>💻 IT BILIMDONI</h1>
            <p>Bilimingizni sinab ko‘ring!</p>
        </header>

        <main>
            <!-- Boshlash oynasi -->
            <section id="start-screen" class="screen">
                <h2>O‘yinga xush kelibsiz!</h2>
                <p>Ismingizni kiriting:</p>

                <input
                    type="text"
                    id="player-name"
                    placeholder="Ismingiz..."
                    maxlength="25"
                >

                <button id="start-btn">O‘yinni boshlash 🚀</button>
            </section>

            <!-- Savollar oynasi -->
            <section id="quiz-screen" class="screen hidden">
                <div class="info">
                    <span id="question-number">Savol: 1/10</span>
                    <span id="score">Ball: 0</span>
                    <span id="mistakes">Xatolar: 0</span>
                </div>

                <div class="progress">
                    <div id="progress-bar"></div>
                </div>

                <h2 id="question">Savol</h2>

                <div id="answers" class="answers"></div>

                <p id="feedback"></p>

                <button id="next-btn" disabled>Keyingi savol ➜</button>
            </section>

            <!-- Natija oynasi -->
            <section id="result-screen" class="screen hidden">
                <h2>🏆 O‘yin yakunlandi!</h2>

                <h3 id="result-name"></h3>

                <div class="result-box">
                    <p id="final-score"></p>
                    <p id="final-mistakes"></p>
                    <p id="final-message"></p>
                </div>

                <button id="restart-btn">Qayta o‘ynash 🔄</button>
            </section>
        </main>

        <footer>
            Ishlab chiqaruvchi: Ulug‘bek.R
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
